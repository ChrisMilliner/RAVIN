[pytest]
markers =
    integration: tests that require live external dependencies (internet access, live La Trobe policy pages, local Ollama, full RAVIN service startup). Excluded from the default test run.

; Default run excludes integration tests, so `pytest` alone stays fast
; and does not require internet/Ollama. Run integration tests
; explicitly with: pytest -m integration
addopts = -m "not integration"
